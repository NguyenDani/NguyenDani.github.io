<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — No such file or directory</title>

    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem;
